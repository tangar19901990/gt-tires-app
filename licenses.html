<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="robots" content="noindex, nofollow">
<title>Ліцензії — top_secret</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E01F26; --red-light:#FF5A52; --dark-bg:#060608; --card-bg:#101116;
  --card-bg-2:#0A0A0D; --text:#F2F3F5; --text-dim:#8B8F98; --text-2:#C9CCD2;
  --border:#20222B; --green:#4FCE5A; --amber:#F0A53A;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Fira Sans',sans-serif;background:var(--dark-bg);color:var(--text);
     padding:14px 12px 40px}
.wrap{max-width:900px;margin:0 auto}

input,select,textarea{width:100%;padding:11px 12px;background:#16171d;border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-family:inherit;font-size:14px}
input:focus,select:focus{outline:none;border-color:var(--red)}
label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:5px;font-weight:600}

.btn{display:inline-block;padding:11px 16px;border:1px solid var(--border);border-radius:10px;
  background:#181920;color:var(--text);font-family:inherit;font-size:13.5px;font-weight:700;
  cursor:pointer;text-align:center;text-decoration:none;transition:.15s}
.btn:hover{background:#1e1f28}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:linear-gradient(135deg,var(--red-light),var(--red));border-color:transparent}
.btn.sm{padding:7px 12px;font-size:12px;font-weight:600}
.btn.wide{display:block;width:100%;margin-top:14px}
.btn.ghost{background:transparent;color:var(--text-dim)}
.btn.danger{color:var(--red-light);border-color:#4D1E20;background:#1C0F10}

/* замок */
#gate{max-width:330px;margin:14vh auto;background:var(--card-bg);border:1px solid var(--red);
  border-radius:18px;padding:30px 24px;text-align:center;box-shadow:0 0 40px rgba(224,31,38,.2)}
#gate h1{font-family:'Oswald',sans-serif;color:var(--red);font-size:24px;letter-spacing:1.5px}
#gate p{color:var(--text-dim);font-size:12px;margin:8px 0 18px}
.msg{font-size:12.5px;font-weight:600;min-height:18px;margin-top:10px;text-align:center}
.msg.ok{color:var(--green)} .msg.err{color:var(--red-light)} .msg.warn{color:var(--amber)}

header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 0 16px;border-bottom:1px solid var(--border);margin-bottom:18px}
.ttl{font-family:'Oswald',sans-serif;font-size:22px;letter-spacing:1px;color:var(--red)}
.ttl small{display:block;font-family:'Fira Sans',sans-serif;font-size:10px;letter-spacing:2px;
  color:var(--text-dim);text-transform:uppercase;margin-top:3px;font-weight:500}

.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:9px 16px;border-radius:999px;border:1px solid var(--border);background:var(--card-bg-2);
  color:var(--text-dim);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.tab.on{background:var(--red);border-color:var(--red);color:#fff}
.tab .n{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;
  background:rgba(255,255,255,.18);font-size:11px}

.card{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;
  padding:15px 16px;margin-bottom:11px}
.card.warn-b{border-color:rgba(240,165,58,.45)}
.card.dead{border-color:#4D1E20;opacity:.75}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.nm{font-family:'Oswald',sans-serif;font-size:18px;line-height:1.2}
.slug{font-size:11px;color:var(--text-dim);font-family:ui-monospace,monospace;margin-top:2px}
.meta{font-size:12.5px;color:var(--text-2);line-height:1.7}
.meta a{color:var(--red-light);text-decoration:none}
.pill{flex:0 0 auto;font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.p-ok{color:var(--green);background:rgba(79,206,90,.12);border:1px solid rgba(79,206,90,.4)}
.p-warn{color:var(--amber);background:rgba(240,165,58,.12);border:1px solid rgba(240,165,58,.4)}
.p-dead{color:var(--red-light);background:rgba(224,31,38,.12);border:1px solid rgba(224,31,38,.4)}
.p-new{color:#4A9BFF;background:rgba(74,155,255,.12);border:1px solid rgba(74,155,255,.4)}
.acts{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.empty{text-align:center;color:var(--text-dim);padding:44px 16px;font-size:13.5px;line-height:1.6}

.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  padding:14px;background:rgba(0,0,0,.75)}
.modal.on{display:flex}
.mbox{width:100%;max-width:390px;max-height:92vh;overflow-y:auto;background:var(--card-bg);
  border:1px solid var(--red);border-radius:16px;padding:22px 20px}
.mbox h3{font-family:'Oswald',sans-serif;font-size:19px;margin-bottom:4px}
.mbox .sub{color:var(--text-dim);font-size:12px;margin-bottom:16px}
.f{margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--border);background:var(--card-bg-2);
  color:var(--text-dim);font-size:12px;font-weight:600;cursor:pointer}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.row2{display:flex;gap:9px;margin-top:16px}
.row2 .btn{flex:1;margin:0}
.hide{display:none}
</style>
</head>
<body>

<div id="gate">
  <h1>top_secret</h1>
  <p>Ліцензії та заявки</p>
  <input type="password" id="pw" placeholder="Пароль адміністратора" autocomplete="off">
  <button class="btn primary wide" id="go">Увійти</button>
  <div class="msg err" id="gateMsg"></div>
</div>

<div class="wrap hide" id="app">
  <header>
    <div class="ttl">Ліцензії<small>клієнти системи</small></div>
    <div style="display:flex;gap:6px">
      <button class="btn sm" id="reload">Оновити</button>
      <button class="btn sm danger" id="out">Вийти</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab on" data-t="leads">Заявки<span class="n" id="nLeads">0</span></button>
    <button class="tab" data-t="lic">Клієнти<span class="n" id="nLic">0</span></button>
  </div>

  <div id="list"></div>
  <div class="msg" id="msg"></div>
</div>

<!-- підключення / продовження -->
<div class="modal" id="grantM">
  <div class="mbox">
    <h3 id="gTitle">Підключити</h3>
    <div class="sub" id="gSub"></div>

    <div class="f">
      <label>Назва</label>
      <input id="gName">
    </div>

    <div class="f">
      <label>client_slug — має збігатися з тим, що у файлі CRM</label>
      <input id="gSlug" placeholder="koleso-brovary">
    </div>

    <div class="f">
      <label>На скільки днів</label>
      <div class="chips" id="gDays">
        <div class="chip on" data-d="14">14 (тріал)</div>
        <div class="chip" data-d="30">30</div>
        <div class="chip" data-d="90">90</div>
        <div class="chip" data-d="365">365</div>
      </div>
    </div>

    <div class="f">
      <label>Оплата, ₴ — порожньо якщо тріал</label>
      <input id="gPrice" type="number" min="0" placeholder="800">
    </div>

    <div class="row2">
      <button class="btn" id="gCancel">Скасувати</button>
      <button class="btn primary" id="gOk">Підключити</button>
    </div>
    <div class="msg" id="gMsg"></div>
  </div>
</div>

<script src="gtdb.js?v=1"></script>
<script>
(function(){
  'use strict';

  var TOKEN = null, TAB = 'leads', LEADS = [], LIC = [], CUR = null;

  /* ---------- вхід ---------- */
  document.getElementById('go').onclick = login;
  document.getElementById('pw').addEventListener('keydown', function(e){
    if (e.key === 'Enter') login();
  });

  function login(){
    var pw = document.getElementById('pw').value.trim();
    var m  = document.getElementById('gateMsg');
    if (!pw){ m.textContent = 'Введи пароль'; return; }

    m.textContent = 'Перевіряю…';
    GTDB.rpc('admin_licenses', { p_token: pw }).then(function(rows){
      TOKEN = pw;
      try { sessionStorage.setItem('gt_admin_pw', pw); } catch(e){}
      LIC = rows || [];
      document.getElementById('gate').classList.add('hide');
      document.getElementById('app').classList.remove('hide');
      document.getElementById('pw').value = '';
      loadLeads();
    }).catch(function(err){
      m.textContent = err.message;
      document.getElementById('pw').value = '';
    });
  }

  try {
    var saved = sessionStorage.getItem('gt_admin_pw');
    if (saved){ document.getElementById('pw').value = saved; login(); }
  } catch(e){}

  document.getElementById('out').onclick = function(){
    try { sessionStorage.removeItem('gt_admin_pw'); } catch(e){}
    location.reload();
  };
  document.getElementById('reload').onclick = function(){ refresh(); };

  /* ---------- завантаження ---------- */
  function refresh(){
    say('Оновлюю…');
    Promise.all([
      GTDB.rpc('admin_licenses', { p_token: TOKEN }),
      GTDB.rpc('admin_leads',    { p_token: TOKEN })
    ]).then(function(r){
      LIC = r[0] || []; LEADS = r[1] || [];
      say(''); render();
    }).catch(function(e){ say(e.message, 'err'); });
  }

  function loadLeads(){
    GTDB.rpc('admin_leads', { p_token: TOKEN }).then(function(rows){
      LEADS = rows || []; render();
    }).catch(function(e){ say(e.message, 'err'); render(); });
  }

  /* ---------- вкладки ---------- */
  document.querySelectorAll('.tab').forEach(function(t){
    t.onclick = function(){
      document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('on'); });
      t.classList.add('on'); TAB = t.dataset.t; render();
    };
  });

  /* ---------- вивід ---------- */
  function render(){
    var openLeads = LEADS.filter(function(l){ return l.status === 'new'; });
    document.getElementById('nLeads').textContent = openLeads.length;
    document.getElementById('nLic').textContent   = LIC.length;

    var box = document.getElementById('list');
    box.innerHTML = '';

    if (TAB === 'leads'){
      if (!LEADS.length){
        box.innerHTML = '<div class="empty">Заявок ще немає.<br>' +
          'Вони з\'являться, коли хтось заповнить форму на сторінці тарифів.</div>';
        return;
      }
      LEADS.forEach(function(l){ box.appendChild(leadCard(l)); });
    } else {
      if (!LIC.length){ box.innerHTML = '<div class="empty">Порожньо</div>'; return; }
      LIC.forEach(function(x){ box.appendChild(licCard(x)); });
    }
  }

  function leadCard(l){
    var d = document.createElement('div');
    var isNew = l.status === 'new';
    d.className = 'card' + (isNew ? '' : ' dead');

    var pill = isNew ? '<span class="pill p-new">нова</span>'
             : l.status === 'done' ? '<span class="pill p-ok">підключено</span>'
             : '<span class="pill p-dead">' + esc(l.status) + '</span>';

    d.innerHTML =
      '<div class="card-top"><div>' +
        '<div class="nm">' + esc(l.shop_name) + '</div>' +
        '<div class="slug">' + when(l.created_at) + '</div>' +
      '</div>' + pill + '</div>' +
      '<div class="meta">' +
        (l.city ? esc(l.city) + '<br>' : '') +
        (l.phone ? '<a href="tel:' + esc(l.phone) + '">' + esc(l.phone) + '</a><br>' : '') +
        (l.telegram ? '<a href="https://t.me/' + esc(String(l.telegram).replace('@','')) +
                      '" target="_blank" rel="noopener">' + esc(l.telegram) + '</a><br>' : '') +
        (l.plan_id ? 'Тариф: ' + esc(l.plan_id) + '<br>' : '') +
        (l.note ? '<span style="color:var(--text-dim)">' + esc(l.note) + '</span>' : '') +
      '</div>';

    if (isNew){
      var a = document.createElement('div');
      a.className = 'acts';

      var bOk = mk('btn sm primary', 'Підключити');
      bOk.onclick = function(){ openGrant({ lead: l }); };

      var bNo = mk('btn sm ghost', 'Відхилити');
      bNo.onclick = function(){
        if (!confirm('Відхилити заявку «' + l.shop_name + '»?')) return;
        GTDB.rpc('admin_lead_status',
          { p_token: TOKEN, p_id: l.id, p_status: 'rejected', p_note: null })
          .then(refresh).catch(function(e){ say(e.message,'err'); });
      };

      a.appendChild(bOk); a.appendChild(bNo);
      d.appendChild(a);
    }
    return d;
  }

  function licCard(x){
    var left = daysLeft(x.paid_until);
    var d = document.createElement('div');
    d.className = 'card' + (!x.is_active || left < 0 ? ' dead' : (left <= 7 ? ' warn-b' : ''));

    var pill;
    if (!x.is_active)   pill = '<span class="pill p-dead">вимкнено</span>';
    else if (left < 0)  pill = '<span class="pill p-dead">спливла</span>';
    else if (left <= 7) pill = '<span class="pill p-warn">' + left + ' дн.</span>';
    else                pill = '<span class="pill p-ok">' + left + ' дн.</span>';

    d.innerHTML =
      '<div class="card-top"><div>' +
        '<div class="nm">' + esc(x.business_name || x.client_slug) +
          (x.is_trial ? ' <span style="font-size:11px;color:var(--amber)">тріал</span>' : '') +
        '</div>' +
        '<div class="slug">' + esc(x.client_slug) + '</div>' +
      '</div>' + pill + '</div>' +
      '<div class="meta">' +
        'До ' + fmtDate(x.paid_until) + '<br>' +
        (x.city ? esc(x.city) + '<br>' : '') +
        (x.phone ? '<a href="tel:' + esc(x.phone) + '">' + esc(x.phone) + '</a><br>' : '') +
        (x.telegram ? '<a href="https://t.me/' + esc(String(x.telegram).replace('@','')) +
                      '" target="_blank" rel="noopener">' + esc(x.telegram) + '</a><br>' : '') +
        (x.notes ? '<span style="color:var(--text-dim)">' + esc(x.notes) + '</span>' : '') +
      '</div>';

    var a = document.createElement('div');
    a.className = 'acts';

    var bExt = mk('btn sm primary', 'Продовжити');
    bExt.onclick = function(){ openGrant({ lic: x }); };
    a.appendChild(bExt);

    var bTog = mk('btn sm ' + (x.is_active ? 'ghost' : ''), x.is_active ? 'Вимкнути' : 'Увімкнути');
    bTog.onclick = function(){
      var to = !x.is_active;
      if (!to && !confirm('Вимкнути доступ для «' + (x.business_name||x.client_slug) + '»?')) return;
      GTDB.rpc('admin_toggle', { p_token: TOKEN, p_slug: x.client_slug, p_active: to })
        .then(refresh).catch(function(e){ say(e.message,'err'); });
    };
    a.appendChild(bTog);

    d.appendChild(a);
    return d;
  }

  /* ---------- модалка ---------- */
  var gm = document.getElementById('grantM'), gDays = 14;

  function openGrant(o){
    CUR = o;
    var isNew = !!o.lead;

    document.getElementById('gTitle').textContent = isNew ? 'Підключити' : 'Продовжити';
    document.getElementById('gSub').textContent   = isNew
      ? 'Створимо доступ і закриємо заявку'
      : 'Дні додаються до чинної дати, не з нуля';

    document.getElementById('gName').value  = isNew ? (o.lead.shop_name || '')
                                                    : (o.lic.business_name || '');
    document.getElementById('gSlug').value  = isNew ? slugify(o.lead.shop_name)
                                                    : o.lic.client_slug;
    document.getElementById('gSlug').readOnly = !isNew;
    document.getElementById('gPrice').value = '';
    document.getElementById('gMsg').textContent = '';
    document.getElementById('gOk').textContent  = isNew ? 'Підключити' : 'Продовжити';

    setDays(isNew ? 14 : 30);
    gm.classList.add('on');
  }

  document.querySelectorAll('#gDays .chip').forEach(function(c){
    c.onclick = function(){ setDays(parseInt(c.dataset.d, 10)); };
  });

  function setDays(n){
    gDays = n;
    document.querySelectorAll('#gDays .chip').forEach(function(c){
      c.classList.toggle('on', parseInt(c.dataset.d,10) === n);
    });
  }

  document.getElementById('gCancel').onclick = function(){ gm.classList.remove('on'); };
  gm.onclick = function(e){ if (e.target === gm) gm.classList.remove('on'); };

  document.getElementById('gOk').onclick = function(){
    var btn  = this;
    var slug = document.getElementById('gSlug').value.trim().toLowerCase();
    var name = document.getElementById('gName').value.trim();
    var pr   = parseInt(document.getElementById('gPrice').value, 10);
    var m    = document.getElementById('gMsg');

    if (!slug){ m.className='msg err'; m.textContent='Вкажи client_slug'; return; }

    btn.disabled = true; btn.textContent = 'Виконую…';
    m.className = 'msg'; m.textContent = '';

    GTDB.rpc('admin_grant', {
      p_token: TOKEN,
      p_slug:  slug,
      p_days:  gDays,
      p_lead_id: CUR.lead ? CUR.lead.id : null,
      p_trial: !(pr > 0),
      p_plan:  CUR.lead ? (CUR.lead.plan_id || null) : null,
      p_price: (pr > 0 ? pr : null),
      p_business_name: name || null
    }).then(function(r){
      gm.classList.remove('on');
      say('Готово. ' + (r && r.business_name ? r.business_name + ' — ' : '') +
          'доступ до ' + fmtDate(r && r.paid_until), 'ok');
      refresh();
    }).catch(function(e){
      m.className = 'msg err'; m.textContent = e.message;
    }).then(function(){
      btn.disabled = false;
      btn.textContent = CUR.lead ? 'Підключити' : 'Продовжити';
    });
  };

  /* ---------- утиліти ---------- */
  function mk(cls, txt){ var b=document.createElement('button'); b.className=cls; b.textContent=txt; return b; }

  function slugify(s){
    var map = {а:'a',б:'b',в:'v',г:'h',ґ:'g',д:'d',е:'e',є:'ye',ж:'zh',з:'z',и:'y',і:'i',
      ї:'yi',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',
      х:'kh',ц:'ts',ч:'ch',ш:'sh',щ:'shch',ь:'',ю:'yu',я:'ya',ы:'y',э:'e',ъ:''};
    return String(s||'').toLowerCase().split('').map(function(c){
      return map[c] !== undefined ? map[c] : c;
    }).join('').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
  }

  function daysLeft(d){
    if (!d) return -1;
    return Math.round((new Date(d + 'T00:00:00') - new Date(new Date().toDateString())) / 86400000);
  }
  function fmtDate(d){
    if (!d) return '—';
    var p = String(d).slice(0,10).split('-');
    return p[2] + '.' + p[1] + '.' + p[0];
  }
  function when(ts){
    if (!ts) return '';
    var d = new Date(ts);
    return d.toLocaleDateString('uk-UA') + ' ' +
           d.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});
  }
  function esc(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function say(t, cls){
    var m = document.getElementById('msg');
    m.textContent = t; m.className = 'msg ' + (cls||'');
    if (t){ clearTimeout(say._t); say._t = setTimeout(function(){ m.textContent=''; }, 7000); }
  }

})();
</script>
</body>
</html>
