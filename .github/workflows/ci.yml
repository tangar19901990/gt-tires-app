name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Перевірка синтаксису app.js
        run: node --check app.js

      - name: Смок-тест бізнес-логіки
        working-directory: tests
        run: |
          npm install
          node smoke-test.js
