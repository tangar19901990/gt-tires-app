<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Тарифи — GT Tires CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E01F26; --red-light:#FF5A52; --red-dark:#8F1015;
  --dark-bg:#060608; --card-bg:#101116; --card-bg-2:#0A0A0D;
  --text:#F2F3F5; --text-dim:#8B8F98; --text-2:#C9CCD2;
  --border:#20222B; --green:#4FCE5A;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Fira Sans',sans-serif;background:var(--dark-bg);color:var(--text);
  min-height:100vh;padding:20px 16px 60px;
  background-image:radial-gradient(circle at 15% -5%,rgba(224,31,38,.20),transparent 40%),
                   radial-gradient(circle at 95% 5%,rgba(255,90,82,.10),transparent 40%);
}
.wrap{max-width:1080px;margin:0 auto}

/* --- шапка --- */
header{text-align:center;padding:24px 0 8px}
.logo{font-family:'Oswald',sans-serif;font-size:40px;line-height:1;color:var(--red);
      text-shadow:0 0 24px rgba(224,31,38,.55);letter-spacing:1px}
.logo small{display:block;font-family:'Fira Sans',sans-serif;font-size:11px;
      letter-spacing:3px;color:var(--text-dim);text-transform:uppercase;margin-top:8px;font-weight:500}
h1{font-family:'Oswald',sans-serif;font-size:30px;margin-top:28px;letter-spacing:.5px}
.lede{color:var(--text-dim);font-size:14px;margin-top:10px;line-height:1.6;max-width:520px;margin-left:auto;margin-right:auto}
.trial-badge{display:inline-block;margin-top:16px;padding:8px 16px;border-radius:999px;
  background:rgba(79,206,90,.12);border:1px solid rgba(79,206,90,.42);color:var(--green);
  font-weight:700;font-size:12.5px}

/* --- перемикач місяць/рік --- */
.toggle{display:flex;justify-content:center;gap:6px;margin:26px 0 4px}
.toggle button{
  padding:9px 18px;border-radius:999px;border:1px solid var(--border);
  background:var(--card-bg-2);color:var(--text-dim);font-family:inherit;
  font-size:13px;font-weight:600;cursor:pointer;transition:.18s
}
.toggle button.on{background:var(--red);border-color:var(--red);color:#fff;
  box-shadow:0 0 20px rgba(224,31,38,.35)}
.save-hint{text-align:center;color:var(--green);font-size:12px;font-weight:600;
  min-height:18px;margin-bottom:18px}

/* --- картки --- */
.cards{display:grid;gap:16px;grid-template-columns:1fr;margin-top:8px}
@media(min-width:760px){.cards{grid-template-columns:repeat(3,1fr);align-items:start}}

.card{
  background:var(--card-bg);border:1px solid var(--border);border-radius:18px;
  padding:26px 22px;display:flex;flex-direction:column;position:relative;
}
.card.featured{
  border-color:var(--red);
  box-shadow:0 0 34px rgba(224,31,38,.22);
  background:linear-gradient(180deg,#15121a 0%,var(--card-bg) 55%);
}
.ribbon{
  position:absolute;top:-11px;left:50%;transform:translateX(-50%);
  background:var(--red);color:#fff;font-size:10.5px;font-weight:700;
  letter-spacing:1.2px;text-transform:uppercase;padding:5px 14px;border-radius:999px;
  white-space:nowrap;box-shadow:0 0 18px rgba(224,31,38,.5)
}
.plan-name{font-family:'Oswald',sans-serif;font-size:22px;letter-spacing:.5px}
.plan-note{color:var(--text-dim);font-size:12.5px;margin-top:4px}
.price-row{margin:18px 0 6px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.price{font-family:'Oswald',sans-serif;font-size:44px;line-height:1;color:var(--red)}
.card.featured .price{color:var(--red-light)}
.per{color:var(--text-dim);font-size:14px;font-weight:500}
.was{color:var(--text-dim);font-size:14px;text-decoration:line-through;opacity:.65}
.yearly-total{color:var(--text-dim);font-size:12px;margin-bottom:6px;min-height:16px}

ul{list-style:none;margin:16px 0 22px;flex:1}
li{position:relative;padding-left:24px;margin-bottom:11px;font-size:13.5px;
   line-height:1.5;color:var(--text-2)}
li::before{content:'';position:absolute;left:4px;top:6px;width:8px;height:8px;
   border-radius:50%;background:var(--red);box-shadow:0 0 8px rgba(224,31,38,.6)}

.btn{
  display:block;width:100%;padding:14px;border:none;border-radius:12px;
  background:#181920;color:var(--text);font-family:inherit;font-size:14.5px;
  font-weight:700;cursor:pointer;text-align:center;text-decoration:none;
  border:1px solid var(--border);transition:.18s
}
.btn:hover{background:#1e1f28}
.btn.primary{background:linear-gradient(135deg,var(--red-light),var(--red));
  border-color:transparent;box-shadow:0 0 26px rgba(224,31,38,.34)}
.btn.primary:hover{filter:brightness(1.08)}

/* --- низ --- */
.foot{margin-top:44px;text-align:center;color:var(--text-dim);font-size:13px;line-height:1.7}
.foot a{color:var(--red-light);text-decoration:none}
.foot a:hover{text-decoration:underline}
.note-box{
  max-width:640px;margin:26px auto 0;padding:16px 18px;border-radius:14px;
  background:var(--card-bg-2);border:1px solid var(--border);
  color:var(--text-dim);font-size:12.5px;line-height:1.65;text-align:left
}
.err{max-width:560px;margin:40px auto;padding:18px;border-radius:12px;
  background:#1C0F10;border:1px solid #4D1E20;color:#FF5A52;font-size:14px;text-align:center}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">GT TIRES<small>CRM для шиномонтажу</small></div>
    <h1>Тарифи</h1>
    <p class="lede">Облік замовлень, клієнтів, каси і складу. Друк рахунку-наряду. Працює з телефона.</p>
    <div class="trial-badge" id="trialBadge"></div>
  </header>

  <div class="toggle" id="toggle" hidden>
    <button id="btnMonth" class="on">Щомісяця</button>
    <button id="btnYear">За рік</button>
  </div>
  <div class="save-hint" id="saveHint"></div>

  <div class="cards" id="cards"></div>

  <div class="note-box" id="noteBox"></div>

  <div class="foot">
    Питання по тарифах — пишіть <a id="tgLink" href="#">у Telegram</a><br>
    <span id="phoneLine"></span>
  </div>

</div>

<script src="pricing-config.js?v=1"></script>
<script>
(function(){
  var C = window.GT_PRICING;
  var cards = document.getElementById('cards');

  /* правки з top_secret мають пріоритет над файлом (тільки на цьому пристрої) */
  try {
    var ov = JSON.parse(localStorage.getItem('gt_pricing_override') || 'null');
    if (ov && Array.isArray(ov.plans) && ov.plans.length) C = ov;
  } catch(e){}

  if (!C || !Array.isArray(C.plans)) {
    cards.innerHTML = '<div class="err">Не вдалося завантажити тарифи.<br>Перевір файл pricing-config.js</div>';
    return;
  }

  var mode = 'month';               // 'month' | 'year'
  var cur  = C.currency || '₴';
  var disc = (C.yearly && C.yearly.enabled) ? Number(C.yearly.discountPercent) || 0 : 0;

  /* шапка */
  document.getElementById('trialBadge').textContent =
    (C.trialDays || 14) + ' днів безкоштовно · без картки';

  var tg = (C.contactTelegram || '').replace('@','');
  var tgLink = document.getElementById('tgLink');
  if (tg) { tgLink.href = 'https://t.me/' + tg; tgLink.textContent = C.contactTelegram; }
  else    { tgLink.removeAttribute('href'); tgLink.textContent = 'у підтримку'; }

  if (C.contactPhone) {
    document.getElementById('phoneLine').textContent = 'Телефон: ' + C.contactPhone;
  }

  document.getElementById('noteBox').innerHTML =
    'Оплата помісячна, скасувати можна будь-коли. Після закінчення оплаченого періоду ' +
    'доступ до системи призупиняється, але <b>дані зберігаються</b> — після поновлення ' +
    'усе на місці.<br><br>Ціни вказані за одну точку.';

  /* перемикач рік/місяць */
  if (disc > 0) {
    document.getElementById('toggle').hidden = false;
    document.getElementById('btnMonth').onclick = function(){ setMode('month'); };
    document.getElementById('btnYear').onclick  = function(){ setMode('year');  };
  }

  function setMode(m){
    mode = m;
    document.getElementById('btnMonth').classList.toggle('on', m === 'month');
    document.getElementById('btnYear').classList.toggle('on',  m === 'year');
    document.getElementById('saveHint').textContent =
      (m === 'year') ? ('Економія ' + disc + '% при оплаті за рік') : '';
    render();
  }

  function fmt(n){ return Math.round(n).toLocaleString('uk-UA'); }

  function render(){
    cards.innerHTML = '';
    C.plans.filter(function(p){ return !p.hidden; }).forEach(function(p){

      var base    = Number(p.price) || 0;
      var perMon  = (mode === 'year') ? base * (100 - disc) / 100 : base;
      var el      = document.createElement('div');
      el.className = 'card' + (p.featured ? ' featured' : '');

      var html = '';
      if (p.featured && p.note) html += '<div class="ribbon">' + esc(p.note) + '</div>';

      html += '<div class="plan-name">' + esc(p.name) + '</div>';
      if (p.note && !p.featured) html += '<div class="plan-note">' + esc(p.note) + '</div>';

      html += '<div class="price-row">' +
                '<span class="price">' + fmt(perMon) + '</span>' +
                '<span class="per">' + cur + ' / ' + esc(p.period || 'міс') + '</span>' +
                (mode === 'year' ? '<span class="was">' + fmt(base) + ' ' + cur + '</span>' : '') +
              '</div>';

      html += '<div class="yearly-total">' +
                (mode === 'year' ? fmt(perMon * 12) + ' ' + cur + ' на рік' : '') +
              '</div>';

      html += '<ul>' + (p.features || []).map(function(f){
                return '<li>' + esc(f) + '</li>';
              }).join('') + '</ul>';

      html += '<a class="btn' + (p.featured ? ' primary' : '') + '" href="#" ' +
              'data-plan="' + esc(p.id) + '">Спробувати ' + (C.trialDays || 14) + ' днів</a>';

      el.innerHTML = html;
      cards.appendChild(el);
    });

    /* кнопки — поки заглушка, підключимо на наступному кроці */
    cards.querySelectorAll('[data-plan]').forEach(function(b){
      b.onclick = function(e){
        e.preventDefault();
        alert('Реєстрація підключається на наступному кроці.\nТариф: ' + b.dataset.plan);
      };
    });
  }

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  render();
})();
</script>
</body>
</html>
